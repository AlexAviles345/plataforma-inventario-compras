name: Platform validation
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t techdistribution-frontend .
      - name: Validate edge image and Compose profile
        working-directory: .
        run: |
          docker build -t techdistribution-nginx-edge infrastructure/nginx
          docker compose -f docker-compose.edge.yml --profile frontend --profile edge config --quiet
  purchases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend/purchases-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: apps/backend/purchases-service/.python-version
          cache: pip
          cache-dependency-path: apps/backend/purchases-service/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -Wa manage.py test
      - run: python -m pip check
      - run: docker build -t techdistribution-purchases .
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend/inventory-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/inventory-service/pom.xml
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify
      - run: docker build -t techdistribution-inventory .
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend/auth-service
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/backend/auth-service/.nvmrc
          cache: npm
          cache-dependency-path: apps/backend/auth-service/package-lock.json
      - run: npm ci --ignore-scripts
      # Único paquete con script de instalación: descarga el binario de librdkafka.
      - run: npm rebuild @confluentinc/kafka-javascript
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Start Kafka and create topics
        working-directory: .
        run: |
          docker compose -f docker-compose.example.yml up -d --wait kafka
          docker compose -f docker-compose.example.yml run --rm kafka-init
      - run: npm run test:e2e -- --runInBand
        env:
          KAFKA_E2E: 'true'
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      - run: node dist/database/migrate.js run
      - run: node dist/database/migrate.js show
      - run: npm run audit:production
      - run: docker build -t techdistribution-auth .
      - if: always()
        working-directory: .
        run: docker compose -f docker-compose.example.yml down -v
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/backend/api-gateway/.nvmrc
          cache: npm
          cache-dependency-path: apps/backend/api-gateway/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run audit:production
      - run: docker build -t techdistribution-gateway .
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose -f docker-compose.example.yml config --quiet
      - run: docker compose -f docker-compose.example.yml up -d --wait postgres-auth postgres-purchases mysql-inventory kafka
      - run: docker compose -f docker-compose.example.yml run --rm kafka-init
      - name: Verify Kafka persistence across container recreation
        shell: bash
        run: |
          broker() { docker compose -f docker-compose.example.yml exec -T kafka "$@"; }
          broker kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ci.persistence --partitions 1 --replication-factor 1
          printf 'persisted\n' | broker kafka-console-producer --bootstrap-server kafka:29092 --topic ci.persistence
          docker compose -f docker-compose.example.yml up -d --wait --force-recreate kafka
          broker kafka-console-consumer --bootstrap-server kafka:29092 --topic ci.persistence --from-beginning --max-messages 1 --timeout-ms 15000 | grep -Fx persisted
      - if: always()
        run: docker compose -f docker-compose.example.yml logs --tail=100
      - if: always()
        run: docker compose -f docker-compose.example.yml down -v
