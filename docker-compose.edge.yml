services:
  frontend:
    build:
      context: ./apps/frontend
    image: techdistribution/frontend-web:local
    profiles: [frontend]
    expose:
      - "8080"
    restart: unless-stopped
    networks: [edge]

  nginx-edge:
    build:
      context: ./infrastructure/nginx
    image: techdistribution/nginx-edge:local
    profiles: [edge]
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      FRONTEND_UPSTREAM: frontend:8080
      GATEWAY_UPSTREAM: host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${EDGE_PORT:-8088}:8080"
    restart: unless-stopped
    networks: [edge]

networks:
  edge:
    driver: bridge
